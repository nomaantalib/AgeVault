services:
  # Unified Web Service (Express API + React Frontend)
  - type: web
    name: agevault-unified
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build-all
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USE_SIMULATED_OTP
        value: "false"
      - key: RESEND_API_KEY_1
        sync: false
      - key: RESEND_API_KEY_2
        sync: false
      - key: RESEND_API_KEY_3
        sync: false
      - key: RESEND_API_KEY_4
        sync: false
      - key: RESEND_API_KEY_5
        sync: false
      - key: RESEND_API_KEY_6
        sync: false
      - key: RESEND_API_KEY_7
        sync: false


