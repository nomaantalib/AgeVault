services:
  # Unified Web Service (Express API + React Frontend)
  - type: web
    name: agevault-unified
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build-all
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USE_SIMULATED_OTP
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
