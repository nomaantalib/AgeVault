services:
  # Backend Web Service (Node/Express API)
  - type: web
    name: agevault-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USE_SIMULATED_OTP
        value: "false"

  # Frontend Static Site (React/Vite app)
  - type: web
    name: agevault-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: node ../backend/scripts/download-models.js && npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: agevault-backend
          type: web
          property: host
